<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex" />
    <meta name="theme-color" content="#0a0a0e" />
    <title>404 Not Found | Damian</title>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500&family=JetBrains+Mono:wght@400;700&display=swap"
      rel="stylesheet"
    />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
      crossorigin="anonymous"
    />
    <link rel="stylesheet" href="../assets/css/variables.css" />
    <link rel="stylesheet" href="../assets/css/base.css" />
    <link rel="stylesheet" href="../assets/css/components.css" />
    <link rel="stylesheet" href="../assets/css/animations.css" />
    <link rel="stylesheet" href="../assets/css/responsive.css" />

    <style>
      /* CSS nội bộ siêu nhẹ dành riêng cho trang 404 */
      .error-container {
        min-height: 100vh;
        min-height: 100dvh;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        text-align: center;
        padding: 2rem;
      }
      .error-code {
        font-family: var(--font-heading);
        font-size: clamp(5rem, 28vw, 8rem);
        color: var(--accent-glow);
        text-shadow: 0 0 20px rgba(255, 70, 150, 0.5);
        margin-bottom: 1rem;
        line-height: 1;
      }
      .error-text {
        font-size: 1.5rem;
        color: var(--text-primary);
        margin-bottom: 2rem;
      }
      .error-desc {
        color: var(--text-secondary);
        margin-bottom: 3rem;
        max-width: 400px;
      }
    </style>
  </head>
  <body>
    <div class="custom-cursor" aria-hidden="true"></div>
    <div class="cursor-glow" aria-hidden="true"></div>

    <main class="error-container">
      <h1 class="error-code glitch-text" data-text="404">404</h1>
      <h2 class="error-text">>_ page_not_found</h2>
      <p class="error-desc">
        The file or directory you are looking for does not exist in this server.
        It might have been moved or deleted.
      </p>
      <a href="../index.html" class="damian-btn">Return to Home</a>
    </main>

    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
      crossorigin="anonymous"
    ></script>
    <script src="../assets/js/cursor.js"></script>
  </body>
</html>
